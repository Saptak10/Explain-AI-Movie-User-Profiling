services:
  - type: web
    name: explain-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/Saptak10/Explain-AI-Movie-User-Profiling/releases/download/trainedmodel/model_best.pt
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,http://localhost:5174
