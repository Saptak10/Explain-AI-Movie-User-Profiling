services:
  - type: web
    name: explain-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    # requirements.txt pins a CUDA-specific torch build (+cu130) for local
    # GPU dev machines; Render's build host has no GPU, so strip that pin
    # here and let pip resolve the plain CPU wheel from PyPI instead.
    buildCommand: sed -e '/extra-index-url/d' -e 's/torch==2.12.0+cu130/torch==2.12.0/' requirements.txt > requirements.render.txt && pip install -r requirements.render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/Saptak10/Explain-AI-Movie-User-Profiling/releases/download/trainedmodel/model_best.pt
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,http://localhost:5174
