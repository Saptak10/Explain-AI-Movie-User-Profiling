services:
  - type: web
    name: explain-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    # deployment branch: no torch at all (see ai_service.py/onnx_model.py),
    # so this is just a plain pip install -- no CUDA-wheel workaround
    # needed anymore.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/Saptak10/Explain-AI-Movie-User-Profiling/releases/download/onnx-bundle/onnx_bundle.zip
      - key: FRONTEND_ORIGINS
        value: https://explain-ai-movie-user-profiling.vercel.app
