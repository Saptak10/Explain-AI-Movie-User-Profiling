services:
  - type: web
    name: explain-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    # requirements.txt pins a CUDA-specific torch build (+cu130) for local
    # GPU dev machines. Render's build host has no GPU, so drop that pin and
    # install the dedicated CPU wheel instead -- plain `pip install torch`
    # from PyPI (even without the +cu130 suffix) still pulls in ~1.5GB of
    # bundled nvidia-cu13* runtime packages as dependencies on Linux, which
    # blew past the free tier's 512MB RAM at boot. The /whl/cpu index serves
    # a build with zero CUDA deps.
    buildCommand: grep -v -e extra-index-url -e "^torch==" requirements.txt > requirements.render.txt && pip install -r requirements.render.txt && pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/Saptak10/Explain-AI-Movie-User-Profiling/releases/download/trainedmodel/model_best.pt
      - key: FRONTEND_ORIGINS
        value: https://explain-ai-movie-user-profiling.vercel.app
